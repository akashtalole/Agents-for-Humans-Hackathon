[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bidwright"
version = "0.1.0"
description = "BidWright: an AI agent that drafts compliant RFP proposals end-to-end for small contractors and business owners."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "strands-agents[anthropic]>=1.50.0",
    "strands-agents-tools>=0.2.0",
    "pydantic>=2.4.0",
    "python-dotenv>=1.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.38.0"]
agentcore = ["bedrock-agentcore>=0.1.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
bidwright = "bidwright.cli:main"

[tool.setuptools.packages.find]
include = ["bidwright*"]
