# Build the MkDocs site and publish it to GitHub Pages.
#
# On a pull request this BUILDS ONLY, so a broken link or a doc removed
# without updating the nav fails the PR instead of silently publishing a
# broken site. Only a push to main actually deploys.
#
# One-time repository setup, which this workflow cannot do for you:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# Until that is set, the deploy job fails with a Pages-not-enabled error.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "**.md"
      - "mkdocs.yml"
      - "scripts/build_docs.py"
      - "requirements-docs.txt"
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**.md"
      - "mkdocs.yml"
      - "scripts/build_docs.py"
      - "requirements-docs.txt"
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Stage and build (strict)
        # --strict turns broken internal links into build failures.
        run: python scripts/build_docs.py --build

      - name: Upload Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .mkdocs-build/site

  deploy:
    # Only from main. A PR from a fork must never be able to publish.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
